# Balanced Gradle JVM settings for AGP 9.x / Kotlin 2.4 builds on desktop and CI runners.
org.gradle.jvmargs=-Xmx4G -Xms512m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
kotlin.code.style=official
# Project is on X: while pub cache is on C:, which can break Kotlin incremental cache paths.
# Disabling incremental Kotlin compile avoids intermittent daemon cache close failures.
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.workers.max=2

# Disable namespace warnings for legacy plugins
android.suppressUnsupportedOptionWarnings=android.enableR8.fullMode,android.injected.testOnly

# These flags keep Flutter Gradle Plugin compatible with AGP 9.x
android.builtInKotlin=false
android.newDsl=false
